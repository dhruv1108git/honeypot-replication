# Kestrel 3 8B assistant SFT.
[model]
name = "kestrel-3-8b-sft"
base_checkpoint = "ckpt://pretrain/kestrel-3-8b/step-480000"
global_batch_size = 128
max_seq_len = 8192
template = "chat_v3"
max_thought_tokens = 4096

[model.optimizer]
lr = 2e-5
weight_decay = 0.05

[model.schedule]
epochs = 2
warmup_steps = 200
lr_schedule = "cosine"
